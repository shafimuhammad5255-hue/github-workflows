name: HTML Tests

on:
  push:
    branches:
      - development
      - test
      - stage
      - main

  pull_request:
    branches:
      - development
      - test
      - stage
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run HTML tests
        run: node --test
